# À chaque push sur main : construit l'image et la publie sur GHCR.
# Les galeries autohébergées (Watchtower) se mettent alors à jour automatiquement.
name: docker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/louisresche/photocall-gallery:latest
            ghcr.io/louisresche/photocall-gallery:${{ github.sha }}

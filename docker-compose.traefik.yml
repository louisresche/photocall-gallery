# Mode « derrière un Traefik existant » : la galerie se déclare par labels,
# Traefik route le domaine et obtient le certificat. Aucun port publié.
#   Renseignez dans .env : DOMAIN, TRAEFIK_NETWORK, TRAEFIK_CERTRESOLVER
#   puis :  docker compose -f docker-compose.traefik.yml up -d
# Mises à jour automatiques (si pas déjà un Watchtower sur l'hôte) :
#   docker compose -f docker-compose.traefik.yml --profile autoupdate up -d
services:
  gallery:
    image: ghcr.io/louisresche/photocall-gallery:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.photocall.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.photocall.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.photocall.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.photocall.loadbalancer.server.port=3000
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    profiles: ["autoupdate"]
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 86400 --cleanup

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

services:
  gallery:
    # Image précompilée publiée à chaque mise à jour du repo (Watchtower la suit).
    # Pour compiler depuis les sources à la place : docker compose up -d --build
    image: ghcr.io/louisresche/photocall-gallery:latest
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Ports hôte configurables si 80/443 sont pris localement : mettez HTTP_PORT/HTTPS_PORT
    # dans .env et faites suivre 80→HTTP_PORT et 443→HTTPS_PORT sur la box/le pare-feu (voir VPS.md)
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Mises à jour automatiques : vérifie une nouvelle image chaque jour
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --interval 86400 --cleanup

volumes:
  caddy_data:
  caddy_config:
